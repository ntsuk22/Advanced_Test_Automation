# Every key can be overridden from the command line, e.g. mvn test -Dbrowser=firefox -Dheadless=false -Dthreads=2
base.url=https://tbcbank.ge
api.base.url=https://apigw.tbcbank.ge/api/v1
browser=chromium
headless=true
slow.mo=0
viewport.width=1920
viewport.height=1080
# Timeouts in milliseconds
timeout.default=15000
timeout.navigation=45000
timeout.assertion=15000
# Parallel TestNG threads (applied by utils.SuiteConfigListener)
threads=3
# Local SQL test-data database (H2). Schema and rows come from resources/testdata/sql and are loaded on connect.
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:tbc_testdata;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:testdata/sql/schema.sql' CHARSET 'UTF-8'\\;RUNSCRIPT FROM 'classpath:testdata/sql/data.sql' CHARSET 'UTF-8'
db.username=sa
db.password=
# Fixed geolocation granted to every browser context (Tbilisi) so the locations page never shows a permission prompt
geo.latitude=41.7151
geo.longitude=44.8271
